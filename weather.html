<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, #1b2340 0%, #0b0f1a 60%);
    color: #e8ecf5;
  }

  .app {
    width: 100%;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 28px 24px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

  .search { display: flex; gap: 8px; }

  .search input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.3);
    color: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search input:focus { border-color: #6c8cff; }
  .search input::placeholder { color: #7d869e; }

  .search button {
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: #6c8cff;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .search button:hover { background: #8aa3ff; }
  .search button:active { transform: scale(0.96); }
  .search button:disabled { opacity: 0.6; cursor: not-allowed; }

  #status {
    margin-top: 20px;
    text-align: center;
    color: #9aa3bd;
    min-height: 1.4em;
  }
  #status.error { color: #ff7b7b; }

  #result { display: none; margin-top: 8px; text-align: center; }
  #result.show { display: block; animation: fade 0.4s ease; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .city { font-size: 1.5rem; font-weight: 600; }
  .country { color: #9aa3bd; font-size: 0.95rem; margin-top: 2px; }
  .icon { font-size: 4.5rem; margin: 14px 0 4px; }
  .temp { font-size: 3.5rem; font-weight: 300; }
  .condition { font-size: 1.1rem; color: #b9c2dc; margin-top: 4px; }

  .details {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 24px;
  }
  .detail {
    background: rgba(0, 0, 0, 0.25);
    border-radius: 14px;
    padding: 12px 6px;
  }
  .detail .label { font-size: 0.75rem; color: #8a93ad; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail .value { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }

  .updated { margin-top: 18px; font-size: 0.75rem; color: #6b748d; }
</style>
</head>
<body>
  <main class="app">
    <h1>🌤️ Weather App</h1>

    <form class="search" id="searchForm">
      <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" required>
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <p id="status">Search for a city to see its current weather.</p>

    <section id="result">
      <div class="city" id="cityName"></div>
      <div class="country" id="countryName"></div>
      <div class="icon" id="icon"></div>
      <div class="temp" id="temp"></div>
      <div class="condition" id="condition"></div>

      <div class="details">
        <div class="detail"><div class="label">Humidity</div><div class="value" id="humidity"></div></div>
        <div class="detail"><div class="label">Feels like</div><div class="value" id="feels"></div></div>
        <div class="detail"><div class="label">Wind</div><div class="value" id="wind"></div></div>
      </div>

      <div class="updated" id="updated"></div>
    </section>
  </main>

<script>
  // Open-Meteo APIs: free, real-time, no API key required
  const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";

  // WMO weather code -> [description, emoji day, emoji night]
  const WEATHER_CODES = {
    0:  ["Clear sky", "☀️", "🌙"],
    1:  ["Mainly clear", "🌤️", "🌙"],
    2:  ["Partly cloudy", "⛅", "☁️"],
    3:  ["Overcast", "☁️", "☁️"],
    45: ["Fog", "🌫️", "🌫️"],
    48: ["Rime fog", "🌫️", "🌫️"],
    51: ["Light drizzle", "🌦️", "🌧️"],
    53: ["Moderate drizzle", "🌦️", "🌧️"],
    55: ["Dense drizzle", "🌧️", "🌧️"],
    56: ["Freezing drizzle", "🌧️", "🌧️"],
    57: ["Heavy freezing drizzle", "🌧️", "🌧️"],
    61: ["Slight rain", "🌦️", "🌧️"],
    63: ["Moderate rain", "🌧️", "🌧️"],
    65: ["Heavy rain", "🌧️", "🌧️"],
    66: ["Freezing rain", "🌧️", "🌧️"],
    67: ["Heavy freezing rain", "🌧️", "🌧️"],
    71: ["Slight snow", "🌨️", "🌨️"],
    73: ["Moderate snow", "🌨️", "🌨️"],
    75: ["Heavy snow", "❄️", "❄️"],
    77: ["Snow grains", "❄️", "❄️"],
    80: ["Slight rain showers", "🌦️", "🌧️"],
    81: ["Moderate rain showers", "🌧️", "🌧️"],
    82: ["Violent rain showers", "⛈️", "⛈️"],
    85: ["Slight snow showers", "🌨️", "🌨️"],
    86: ["Heavy snow showers", "❄️", "❄️"],
    95: ["Thunderstorm", "⛈️", "⛈️"],
    96: ["Thunderstorm with hail", "⛈️", "⛈️"],
    99: ["Thunderstorm with heavy hail", "⛈️", "⛈️"]
  };

  const form = document.getElementById("searchForm");
  const input = document.getElementById("cityInput");
  const btn = document.getElementById("searchBtn");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  function setStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.classList.toggle("error", isError);
  }

  async function getWeather(city) {
    // Step 1: convert city name to coordinates
    const geoRes = await fetch(`${GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
    if (!geoRes.ok) throw new Error("Could not look up the city.");
    const geoData = await geoRes.json();
    if (!geoData.results || geoData.results.length === 0) {
      throw new Error(`City "${city}" not found. Check the spelling.`);
    }
    const place = geoData.results[0];

    // Step 2: fetch current weather for those coordinates
    const params = new URLSearchParams({
      latitude: place.latitude,
      longitude: place.longitude,
      current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day",
      timezone: "auto"
    });
    const wRes = await fetch(`${WEATHER_URL}?${params}`);
    if (!wRes.ok) throw new Error("Could not fetch weather data.");
    const wData = await wRes.json();

    return { place, current: wData.current };
  }

  function render({ place, current }) {
    const info = WEATHER_CODES[current.weather_code] || ["Unknown", "🌡️", "🌡️"];
    const emoji = current.is_day ? info[1] : info[2];

    document.getElementById("cityName").textContent = place.name;
    document.getElementById("countryName").textContent =
      [place.admin1, place.country].filter(Boolean).join(", ");
    document.getElementById("icon").textContent = emoji;
    document.getElementById("temp").textContent = `${Math.round(current.temperature_2m)}°C`;
    document.getElementById("condition").textContent = info[0];
    document.getElementById("humidity").textContent = `${current.relative_humidity_2m}%`;
    document.getElementById("feels").textContent = `${Math.round(current.apparent_temperature)}°C`;
    document.getElementById("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
    document.getElementById("updated").textContent = `Last updated: ${current.time.replace("T", " ")} (local time)`;

    resultEl.classList.remove("show");
    void resultEl.offsetWidth; // restart animation
    resultEl.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const city = input.value.trim();
    if (!city) return;

    btn.disabled = true;
    resultEl.classList.remove("show");
    setStatus("Fetching weather...");

    try {
      const data = await getWeather(city);
      setStatus("");
      render(data);
    } catch (err) {
      setStatus(err.message || "Something went wrong. Try again.", true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
